{{ define "hx_css" }}
<style>
    :root {
        --primary-color: #4A154B;
        --secondary-color: #1D9BD1;
        --accent-color: #ECB22E;
        --success-color: #2EB67D;
        --error-color: #E01E5A;

        --bg-color: #FFFFFF;
        --sidebar-bg: #3F0E40;
        --sidebar-text-color: #FFFFFF;
        --sidebar-muted: rgba(255, 255, 255, 0.7);
        --sidebar-hover-color: #350D36;
        --channel-active-bg: #1164A3;
        --text-color: #1D1C1D;
        --text-secondary: #616061;
        --border-color: rgba(29, 28, 29, 0.13);
        --hover-color: rgba(29, 28, 29, 0.04);
        --active-color: rgba(29, 28, 29, 0.1);
        --message-hover: #F8F8F8;
        --link-color: #1264A3;
        --mention-bg: rgba(29, 155, 209, 0.1);
        --broadcast-bg: rgba(242, 199, 68, 0.4);
        --code-color: #E01E5A;
        --code-bg: rgba(29, 28, 29, 0.04);
        --quote-bar: #DDDDDD;
        --shadow-color: rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #1A1D21;
            --sidebar-bg: #19171D;
            --sidebar-text-color: #FFFFFF;
            --sidebar-muted: rgba(209, 210, 211, 0.7);
            --sidebar-hover-color: #27242C;
            --channel-active-bg: #1164A3;
            --text-color: #D1D2D3;
            --text-secondary: #ABABAD;
            --border-color: rgba(209, 210, 211, 0.13);
            --hover-color: rgba(209, 210, 211, 0.06);
            --active-color: rgba(255, 255, 255, 0.1);
            --message-hover: #222529;
            --link-color: #1D9BD1;
            --mention-bg: rgba(29, 155, 209, 0.15);
            --broadcast-bg: rgba(242, 199, 68, 0.25);
            --code-color: #E8912D;
            --code-bg: rgba(232, 232, 232, 0.04);
            --quote-bar: #545454;
            --shadow-color: rgba(0, 0, 0, 0.28);
        }
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Lato, "Slack-Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        color: var(--text-color);
        background-color: var(--bg-color);
        line-height: 1.46668;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    a { color: var(--link-color); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .connection-status {
        padding: 0.75rem 1rem;
        background-color: var(--error-color);
        color: var(--bg-color);
        font-weight: 600;
        text-align: center;
    }

    .connection-status[hidden] {
        display: none;
    }

    .connection-status:not([hidden]) + .container {
        height: calc(100vh - 2.5rem);
    }

    .container {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .channel-sidebar {
        width: 260px;
        padding-bottom: 1.5rem;
        flex: none;
        background-color: var(--sidebar-bg);
        color: var(--sidebar-text-color);
        overflow-y: auto;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Sidebar workspace heading */
    .channel-sidebar header {
        color: var(--sidebar-text-color);
        padding: 0 16px;
        height: 64px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 12px;
    }

    .sidebar-header-inner {
        flex: auto;
        min-width: 0;
    }

    .sidebar-header-inner h1 {
        font-size: 18px;
        line-height: 1.33;
        font-weight: 900;
        color: var(--sidebar-text-color);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .subtitle {
        font-size: 13px;
        color: var(--sidebar-muted);
    }

    .viewer-button, #conversation-start {
        font: inherit;
        color: var(--text-color);
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: .4rem .6rem;
    }

    .viewer-button { cursor: pointer; }
    .viewer-button:disabled { cursor: default; opacity: .5; }
    .viewer-button:hover:not(:disabled) { background: var(--hover-color); }
    .viewer-button:focus-visible, #conversation-start:focus-visible {
        outline: 2px solid var(--secondary-color);
        outline-offset: 2px;
    }
    .settings-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        border-radius: 6px;
        color: var(--sidebar-muted);
        background: transparent;
        cursor: pointer;
    }
    .settings-button:hover { background: var(--sidebar-hover-color); color: var(--sidebar-text-color); }
    .settings-button:focus-visible {
        outline: 2px solid var(--sidebar-text-color);
        outline-offset: 2px;
        background: var(--sidebar-hover-color);
    }
    .sidebar-title { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .sidebar-title h1 { margin: 0; }
    .conversation-title { display: flex; align-items: center; gap: .5rem; }
    .jump-latest-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        border-radius: 6px;
        color: var(--text-secondary);
        background: transparent;
        cursor: pointer;
    }
    .jump-latest-button:hover:not(:disabled) {
        background: var(--hover-color);
        color: var(--text-color);
    }
    .jump-latest-button:focus-visible {
        outline: 2px solid var(--secondary-color);
        outline-offset: 2px;
    }
    .jump-latest-button:disabled { cursor: default; opacity: .5; }
    #viewer-settings {
        margin: auto;
        padding: 1.5rem;
        max-width: min(30rem, calc(100vw - 2rem));
        color: var(--text-color);
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
    }
    #viewer-settings::backdrop { background: var(--shadow-color); }
    #settings-form { display: flex; flex-direction: column; gap: 1rem; }
    .settings-actions { display: flex; justify-content: flex-end; gap: .5rem; }

    /* Sidebar conversation list */
    .channel-list {
        margin-bottom: 16px;
    }

    .channel-header {
        color: var(--sidebar-muted);
        padding: 0 16px;
        height: 28px;
        display: flex;
        align-items: center;
        font-size: 15px;
        cursor: default;
    }

    summary.channel-header {
        cursor: pointer;
        list-style: none;
    }

    summary.channel-header::-webkit-details-marker { display: none; }

    summary.channel-header::before {
        content: "\25B8";
        display: inline-block;
        width: 1rem;
        transition: transform .1s;
    }

    details[open] > summary.channel-header::before { transform: rotate(90deg); }

    .channel-list a {
        color: var(--sidebar-muted);
        padding: 0 16px 0 18px;
        height: 28px;
        line-height: 28px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 2px;
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 6px;
        margin: 0 8px;
    }

    .channel-list a:hover {
        background-color: var(--sidebar-hover-color);
    }

    .channel-list a.active {
        background-color: var(--channel-active-bg);
        color: var(--sidebar-text-color);
    }

    .ch-prefix {
        display: inline-block;
        width: 18px;
        flex: none;
        text-align: center;
        opacity: .8;
    }

    .ch-name {
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Conversation view */
    #conversation {
        overflow: hidden;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        display: flex;
        background-color: var(--bg-color);
    }

    .container.thread-open #conversation {
        flex: 1 1 60%;
    }

    .container:has(.static-user-profile-panel:target) #conversation {
        flex: 0 0 40%;
    }

    .conversation-header,
    .user-profile-header,
    .thread-header {
        padding: 0 20px;
        min-height: 49px;
        flex: none;
        align-items: center;
        display: flex;
        border-bottom: 1px solid var(--border-color);
    }

    .thread-header {
        justify-content: space-between;
        gap: 1rem;
    }

    .thread-title {
        display: flex;
        align-items: baseline;
        gap: .5rem;
        min-width: 0;
    }

    .thread-header h2 {
        color: var(--text-color);
        font-size: 18px;
        font-weight: 900;
        line-height: 1.33;
        margin: 0;
    }

    .thread-channel {
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .thread-link-row {
        padding: .5rem 20px 0;
        flex: none;
        font-size: 13px;
    }

    .conversation-inner,
    .user-profile-header-inner {
        display: flex;
        flex-direction: column;
        padding: 8px 0;
        min-width: 0;
    }

    .user-profile-header-inner {
        width: 100%;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
    }

    .conversation-inner h2,
    .conversation-inner h3,
    .user-profile-header-inner h3 {
        color: var(--text-color);
        font-size: 18px;
        font-weight: 900;
        line-height: 1.33;
        margin: 0;
    }

    .conversation-inner p {
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        font-size: 13px;
        text-overflow: ellipsis;
    }

    .message-list,
    .user-profile {
        padding: 8px 0 16px;
        flex: 1;
        overflow-y: auto;
    }

    .user-profile {
        padding: 20px;
    }

    /* Date divider, sticky like Slack's */
    .day-divider {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 8px 0;
        height: 28px;
    }

    .day-divider::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px solid var(--border-color);
        z-index: -1;
    }

    .day-divider span {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 0 16px;
        font-size: 13px;
        font-weight: 700;
        line-height: 26px;
        color: var(--text-color);
    }

    article.message {
        display: flex;
        align-items: flex-start;
        padding: 8px 20px;
        position: relative;
    }

    article.message.continued {
        padding-top: 2px;
        padding-bottom: 2px;
    }

    article.message:has(+ article.message.continued) {
        padding-bottom: 2px;
    }

    article.message:hover {
        background-color: var(--message-hover);
    }

    .gutter {
        width: 36px;
        flex: none;
        margin-right: 8px;
    }

    article.message img.avatar {
        display: block;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        background-color: var(--hover-color);
    }

    .hover-time {
        display: block;
        visibility: hidden;
        width: 36px;
        text-align: right;
        font-size: 12px;
        line-height: 22px;
        color: var(--text-secondary);
    }

    article.message:hover .hover-time { visibility: visible; }

    article.message .message-inner {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
    }

    .message-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
    }

    .message-sender,
    .message-sender a {
        font-weight: 900;
        color: var(--text-color);
    }

    .message-timestamp {
        font-size: 12px;
        color: var(--text-secondary);
    }

    .message-content {
        overflow-wrap: anywhere;
    }

    .message-text {
        color: var(--text-color);
        line-height: 1.46668;
    }

    article.message.system .message-text {
        color: var(--text-secondary);
    }

    .message-text b { font-weight: 700; }

    .mention {
        color: var(--link-color);
        background: var(--mention-bg);
        border-radius: 3px;
        padding: 0 2px;
    }

    .mention.broadcast {
        color: var(--text-color);
        background: var(--broadcast-bg);
    }

    a:hover .mention { text-decoration: underline; }

    .message-text code,
    .message-text pre {
        font-family: Monaco, Menlo, Consolas, "Courier New", monospace;
        font-size: 12px;
    }

    .message-text code {
        color: var(--code-color);
        background: var(--code-bg);
        border: 1px solid var(--border-color);
        border-radius: 3px;
        padding: 2px 3px 1px;
    }

    .message-text pre {
        display: block;
        margin: 4px 0;
        padding: 8px;
        line-height: 1.5;
        white-space: pre-wrap;
        color: var(--text-color);
        background: var(--code-bg);
        border: 1px solid var(--border-color);
        border-radius: 4px;
    }

    .message-text blockquote.quote {
        border-left: 4px solid var(--quote-bar);
        padding-left: 12px;
        margin: 4px 0;
    }

    .message-inner footer.thread-info {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        padding: 4px 6px;
        margin-left: -6px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 13px;
        max-width: 600px;
    }

    .message-inner footer.thread-info:hover {
        background: var(--bg-color);
        border-color: var(--border-color);
    }

    .reply-count { font-weight: 700; }

    .last-reply { color: var(--text-secondary); }

    .reply-context {
        font-size: 13px;
        color: var(--text-secondary);
    }

    /* File attachments */
    .slack-files {
        margin-top: 4px;
    }

    .slack-files p {
        display: none;
    }

    .file-hidden {
        background-color: var(--message-hover);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: .75rem;
        margin-bottom: .5rem;
        color: var(--text-secondary);
    }

    .file-image, .file-video, .file-audio {
        display: block;
        max-width: min(100%, 360px);
        max-height: 360px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
    }

    .file-preview-container {
        display: block;
        margin: 4px 0;
    }

    .file-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        max-width: 426px;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 12px;
        margin: 4px 0;
        color: var(--text-color);
        font-weight: 700;
        font-size: 15px;
    }

    .file-link:before {
        content: "";
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: var(--channel-active-bg);
    }

    .file-link:hover {
        background-color: var(--message-hover);
        text-decoration: none;
    }

    /* Link previews */
    .slack-attachment {
        border-left: 4px solid var(--quote-bar);
        padding: 2px 0 2px 12px;
        margin: 6px 0 2px;
        max-width: 600px;
        font-size: 15px;
    }

    .slack-attachment .author { font-weight: 700; }
    .slack-attachment .att-title { font-weight: 700; }
    .slack-attachment .footer { font-size: 12px; color: var(--text-secondary); }
    .slack-attachment img.icon { width: 16px; height: 16px; border-radius: 3px; vertical-align: text-bottom; margin-right: 4px; }
    .slack-attachment .attachment-image { display: block; max-width: min(100%, 360px); max-height: 360px; border-radius: 8px; margin-top: 6px; }

    /* User profile sidebar */
    .profile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: .75rem;
    }

    .profile-header h2 {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--text-color);
        margin: 0;
    }

    .close-button {
        color: var(--text-secondary);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        width: 1.5rem;
        height: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        text-decoration: none;
        flex: none;
    }

    .close-button:hover {
        background-color: var(--hover-color);
        color: var(--text-color);
    }

    .user-profile {
        display: flex;
        flex-direction: column;
    }

    .profile-name {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-color);
        padding-top: .5rem;
    }

    .profile-image {
        border-radius: 4px;
        object-fit: cover;
        width: min(100%, 18rem);
    }

    .profile-details {
        list-style-type: none;
        padding: 0;
        margin: 0;
        padding-top: .5rem;
    }

    .profile-details li {
        font-size: .875rem;
        color: var(--text-secondary);
        margin-bottom: .5rem;
        display: flex;
    }

    .profile-details li span {
        color: var(--text-color);
        margin-left: 4px;
    }

    .thread {
        display: none;
        flex: 0 0 40%;
        min-width: 0;
        overflow-y: auto;
        border-left: 1px solid var(--border-color);
        background-color: var(--bg-color);
    }

    .container.thread-open .thread {
        display: flex;
        flex-direction: column;
    }

    .static-user-profile-panel {
        display: none;
    }

    .static-user-profile-panel:target {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 60%;
        max-width: 48rem;
        min-width: 20rem;
        z-index: 10;
        overflow-y: auto;
        border-left: 1px solid var(--border-color);
        background-color: var(--bg-color);
        box-shadow: -4px 0 12px var(--shadow-color);
    }

    .unknown-user {
        color: var(--text-secondary);
        font-style: italic;
    }

    /* Tab list */
    .tab-list {
        display: flex;
        gap: .25rem;
        margin-top: .5rem;
    }

    button.tab {
        background: none;
        border: 1px solid transparent;
        border-bottom: none;
        padding: .3rem .9rem;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: .875rem;
        border-radius: 4px 4px 0 0;
        font-family: inherit;
        /* reserve space for the accent bar so layout doesn't shift on select */
        box-shadow: inset 0 -3px 0 transparent;
        transition: color 0.1s, box-shadow 0.1s;
    }

    button.tab:hover:not([disabled]) {
        color: var(--text-color);
        background-color: var(--hover-color);
    }

    button.tab:focus-visible {
        outline: 2px solid var(--secondary-color);
        outline-offset: -2px;
    }

    button.tab.selected {
        border-color: var(--border-color);
        color: var(--text-color);
        font-weight: 700;
        background-color: var(--bg-color);
        /* prominent accent underline on the active tab */
        box-shadow: inset 0 -3px 0 var(--primary-color);
    }

    button.tab.disabled,
    button.tab[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
    }

    /* Alias form and input error states */
    .alias-form {
        flex-wrap: wrap;
        align-items: center;
    }

    input.input-error {
        border-color: var(--error-color);
        outline: 2px solid var(--error-color);
        outline-offset: -1px;
    }

    .field-error {
        width: 100%;
        color: var(--error-color);
        font-size: .8rem;
        margin-top: .2rem;
    }

    /* Channel name row with inline alias pencil */
    .channel-name {
        display: flex;
        align-items: center;
        gap: .35rem;
    }

    .alias-edit-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-secondary);
        padding: .2rem;
        border-radius: .25rem;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: opacity 0.15s, background-color 0.15s;
        flex-shrink: 0;
    }

    .channel-name:hover .alias-edit-btn,
    .alias-edit-btn:focus-visible {
        opacity: 1;
    }

    .alias-edit-btn:hover {
        background-color: var(--hover-color);
        color: var(--text-color);
    }

    .alias-edit-btn:focus-visible {
        outline: 2px solid var(--secondary-color);
        outline-offset: -2px;
    }

    /* Canvas view */
    .canvas-container {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .canvas-frame {
        width: 100%;
        flex: 1;
        border: none;
    }

    .canvas-unavailable {
        padding: 1.5rem;
        color: var(--text-secondary);
    }

    @media (max-width: 48rem) {
        .container {
            flex-direction: column;
            height: auto;
            min-height: 100vh;
            overflow: visible;
        }

        .connection-status:not([hidden]) + .container {
            height: auto;
            min-height: calc(100vh - 2.5rem);
        }

        .channel-sidebar {
            width: 100%;
            max-height: 35vh;
            padding-bottom: .75rem;
        }

        #conversation,
        .container.thread-open #conversation {
            flex: none;
            min-height: 50vh;
        }

        .container:has(.static-user-profile-panel:target) #conversation {
            flex: none;
        }

        /* Live conversations need their own scroll range on narrow screens. */
        #conversation .message-list:has(> [data-conversation-content]) {
            max-height: 65vh;
        }

        .thread,
        .container.thread-open .thread {
            flex: none;
            border-left: none;
            border-top: 1px solid var(--border-color);
        }

        .static-user-profile-panel:target {
            left: 0;
            width: 100%;
